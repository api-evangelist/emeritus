aid: emeritus
name: Emeritus
description: 'Emeritus is a global online education company that partners with more than 80 premier
  universities — including Wharton, MIT, Columbia, Harvard, Kellogg, and UC Berkeley — to deliver
  outcome-based executive education, professional certificates, and skill-development programs to over
  500,000 learners worldwide. It operates across individual learners, enterprise/corporate training, and
  university-branded partnership programs, spanning topics such as AI and machine learning, data science,
  finance, leadership, and digital transformation through instructor-led online and blended formats.
  Emeritus is backed by Accel and the SoftBank Vision Fund. This profile was surfaced as a VC portfolio
  lead and enriched by the API Evangelist pipeline; Emeritus publishes no public developer API surface.'
